name: review-images

# Copies the served images of the printings of the given cards into the
# branch review/images (one large rendition per printing, plus an index),
# so that anyone can read what is printed on the cards without leaving
# GitHub - for example to record a card's printed face in data/errata.json
# when it differs from the text the API serves. Read-only toward the
# domain; the branch is scratch and force-pushed every time.

on:
  workflow_dispatch:
    inputs:
      cards:
        description: "codex ids, space-separated (e.g. C000002 C000005); every printing of each"
        required: true
      rendition:
        description: "small, normal, large or original"
        default: "large"

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Copy the images of every printing of the given cards
        env:
          CARDS: ${{ inputs.cards }}
          RENDITION: ${{ inputs.rendition }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path
          from registry.hosted import USER_AGENT
          wanted = set(os.environ["CARDS"].split())
          rendition = os.environ["RENDITION"]
          export = json.load(open("export/registry.json", encoding="utf-8"))
          cards = {c["codex_id"]: c for c in export["cards"] if c["codex_id"] in wanted}
          missing = wanted - set(cards)
          if missing:
              raise SystemExit(f"unknown codex ids: {sorted(missing)}")
          out = Path("review/images"); out.mkdir(parents=True, exist_ok=True)
          lines = ["# Images for review", "", f"Rendition: {rendition}. Generated by the review-images workflow.", ""]
          for cid in sorted(cards):
              card = cards[cid]
              lines += [f"## {cid} {card['name']}", "", "Current rules text (API):", "", "> " + card["rules_text"].replace("\n", "\n> "), ""]
              for p in sorted((p for p in export["printings"] if p["codex_id"] == cid), key=lambda p: (p["released_at"] or "", p["printing_id"])):
                  faces = [("front", p["image_urls"])] + ([("back", p["back"]["image_urls"])] if p.get("back") and p["back"].get("image_urls") else [])
                  for face, urls in faces:
                      if not urls:
                          lines.append(f"- {p['printing_id']} {p['set_name']} {p['product']} {p['finish']} {p['released_at']} ({face}): no image held")
                          continue
                      url = urls[rendition]
                      ext = url.rsplit(".", 1)[-1]
                      name = f"{p['printing_id']}{'.back' if face == 'back' else ''}.{ext}"
                      req = urllib.request.Request(url, headers={"User-Agent": USER_AGENT})
                      with urllib.request.urlopen(req, timeout=60) as r:
                          (out / name).write_bytes(r.read())
                      lines.append(f"- {p['printing_id']} {p['set_name']} {p['product']} {p['finish']} {p['released_at']} {p['image_status']} ({face}): `{name}`")
                      time.sleep(0.2)  # well under the edge rate rule
              lines.append("")
          (out / "INDEX.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"{sum(1 for _ in out.iterdir()) - 1} image(s) for {len(cards)} card(s)")
          PY
      - name: Commit to the review branch
        run: |
          git config user.name "registry-review"
          git config user.email "actions@github.com"
          git checkout -q -B review/images
          git add -f review/images
          git commit -q -m "review: images of $(date -u +%Y-%m-%d) for ${CARDS:0:60}" || true
          git push --force origin review/images
          echo "committed to branch review/images"
        env:
          CARDS: ${{ inputs.cards }}
