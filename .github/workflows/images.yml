name: images

# Card images, from the publisher's public folder to the domain.
#   list  - list the folder, map files to printings and faces, commit the
#           listing to the review/image-listing branch. Read-only.
#   sync  - list, then download what changed (new file, new MD5, new
#           recipe), render the renditions, upload them to the bucket's
#           images/ prefix (content-addressed: an existing name is never
#           overwritten), verify every held object through the CDN, and
#           open a pull request with data/images.json and the regenerated
#           export. Nothing reaches main except through that PR, and no
#           published record references an image until the release
#           workflow has checked it again.
# Toward Google: a service account's bearer token (secret
# GDRIVE_SERVICE_ACCOUNT; it reads only what is public, but counts against
# the project's quota instead of the abuse filter that blocks anonymous
# cloud addresses), falling back to a plain API key; one request at a
# time, identified. Toward the publisher: the same courtesy their API
# asks for. The aws CLI is only the S3 client for R2.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "list (review the folder) or sync (fetch, upload, verify, open a PR)"
        type: choice
        options: [list, sync]
        default: list
      limit:
        description: "sync: at most this many images this run (empty: everything with a service account, 1500 anonymously; 0 forces everything)"
        default: ""
  schedule:
    # Weekly sync, Tuesday 06:00 UTC (the drift check runs Monday): a new
    # set's images, or the rest of a batch Google cut short, arrive as a
    # pull request without anyone dispatching.
    - cron: "0 6 * * 2"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: images
  cancel-in-progress: false

env:
  R2_BUCKET: ${{ vars.R2_BUCKET }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  AWS_DEFAULT_REGION: auto
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pillow jsonschema google-auth requests

      - name: List the public folder and map files to printings
        env:
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
          GDRIVE_API_KEY: ${{ secrets.GDRIVE_API_KEY }}
        run: python -m registry.images list --out review/image-listing.json

      - name: Keep the listing as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-listing
          path: review/image-listing.json
          retention-days: 30

      - name: Commit the listing to the review branch
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'list'
        run: |
          git config user.name "registry-images"
          git config user.email "actions@github.com"
          git checkout -q -B review/image-listing
          git add -f review/image-listing.json
          git commit -q -m "images: folder listing of $(date -u +%Y-%m-%d)"
          git push --force origin review/image-listing
          echo "listing committed to branch review/image-listing"

      # ---- sync

      - name: Hosting must be configured
        if: (github.event_name == 'schedule' || inputs.mode == 'sync') && env.R2_BUCKET == ''
        run: |
          echo "::error::vars.R2_BUCKET is not set; images cannot be uploaded (see CONTRIBUTING, Hosting)"
          exit 1

      - name: Fetch what changed and render the renditions
        if: github.event_name == 'schedule' || inputs.mode == 'sync'
        env:
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
          GDRIVE_API_KEY: ${{ secrets.GDRIVE_API_KEY }}
          LIMIT: ${{ inputs.limit }}
        # No --limit: everything with a service account, 1,500 anonymously.
        # The budget leaves the six-hour job time to upload, verify and open
        # the PR; the next run continues from data/images.json.
        run: python -m registry.images fetch --listing review/image-listing.json --work work/images --budget-minutes 240 ${LIMIT:+--limit "$LIMIT"}

      - name: Keep the failure report, if any
        if: (github.event_name == 'schedule' || inputs.mode == 'sync') && always()
        uses: actions/upload-artifact@v4
        with:
          name: image-failures
          path: review/image-failures.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload the rendered objects
        if: github.event_name == 'schedule' || inputs.mode == 'sync'
        run: python -m registry.images upload --work work/images --bucket "$R2_BUCKET"

      - name: Verify every held object through the CDN
        if: github.event_name == 'schedule' || inputs.mode == 'sync'
        run: python -m registry.images verify

      - name: Regenerate the export and validate
        if: github.event_name == 'schedule' || inputs.mode == 'sync'
        run: |
          python -m registry.export
          python -m registry.validate --against HEAD

      - name: Open a pull request if anything changed
        if: github.event_name == 'schedule' || inputs.mode == 'sync'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/images.json export/; then
            echo "no image changes"
            exit 0
          fi
          BRANCH="images/$(date -u +%Y-%m-%d-%H%M)"
          git config user.name "registry-images"
          git config user.email "actions@github.com"
          git checkout -b "$BRANCH"
          git add data/images.json export/
          held=$(python3 -c "import json; d=json.load(open('data/images.json')); print(sum(len(f) for f in d['printings'].values()))")
          git commit -m "images: $(date -u +%Y-%m-%d), $held face(s) held"
          git push origin "$BRANCH"
          gh pr create --fill --title "Images $(date -u +%Y-%m-%d)" \
            --body "Images fetched from the publisher's public folder, rendered, uploaded to the bucket and verified through the CDN; data/images.json records each source and key, and the export derives image_urls / image_status from it. Review the export diff, merge, then tag a release so the records reach the domain."
