name: release

# Publishes a data release. Two ways in, one path out:
#   - push an annotated tag (v3.1.0, v4.0.0, ...): its message is the notes;
#   - run the workflow by hand with a version and notes: the workflow creates
#     that annotated tag on the chosen ref first.
# Either way it then proves the invariants on the tagged commit, builds the
# release manifest and the published objects (changes.json among them,
# describing the way from the previous release and refusing a release that
# removes an identifier within a major), and - once hosting is
# configured (vars.R2_BUCKET) - uploads the release to its own immutable
# root on api.kairosarchive.net, verifies byte for byte what the CDN serves,
# marks the root RELEASED, lists it in versions.json and points the moving
# major alias (/v3/) at it. Only then is the GitHub release created, with the
# tag message as its notes and the manifest attached. Before hosting is
# configured the hosted steps are skipped with a warning and the release is
# GitHub-only.
#
# Guarantees this file enforces:
#   - bytes at a published path never change: a root that already carries a
#     different registry.json.sha256 fails the run; a root already marked
#     RELEASED is not re-uploaded (a re-run after a GitHub-side failure just
#     redoes the pointers and the release);
#   - nothing is listed in versions.json, and the alias never moves, until the
#     CDN has been seen serving the release;
#   - the alias only moves forward (versions.json decides), and it moves in
#     one operation, so no client ever sees a mixed dataset;
#   - two releases cannot interleave (concurrency group);
#   - secrets reach the shell only through env:.
# The aws CLI is used purely as the standard S3-compatible client for R2;
# no AWS account or service is involved anywhere.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to create and release, e.g. v3.1.0"
        required: true
      notes:
        description: "Release notes (Markdown). Become the tag message."
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  R2_BUCKET: ${{ vars.R2_BUCKET }}
  REGISTRY_BASE_URL: ${{ vars.REGISTRY_BASE_URL }}
  CF_ZONE_ID: ${{ vars.CF_ZONE_ID }}
  CF_REDIRECT_RULE_ID: ${{ vars.CF_REDIRECT_RULE_ID }}
  # The aws CLI as an R2 client: credentials and endpoint from secrets; R2
  # does not implement the newer default request checksums, so ask for them
  # only where the protocol requires them.
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  AWS_DEFAULT_REGION: auto
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create the annotated tag
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$VERSION" in v[0-9]*) ;; *) echo "::error::version must look like v3.1.0"; exit 1;; esac
          git config user.name "registry-release"
          git config user.email "actions@github.com"
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          if git rev-parse -q --verify "refs/tags/$VERSION^{commit}" > /dev/null; then
            # The tag exists: an earlier attempt at this release. At HEAD it is
            # simply reused. Elsewhere it may move to HEAD only while nothing
            # has been published under it - no GitHub release and no RELEASED
            # root on the domain - because until then the tag is an attempt,
            # not a release. Once either exists, the tag is history.
            if [ "$(git rev-parse "$VERSION^{commit}")" = "$(git rev-parse HEAD)" ]; then
              echo "::notice::tag $VERSION already exists at HEAD; reusing it"
            else
              if [ -n "$R2_BUCKET" ] && aws s3 cp "s3://$R2_BUCKET/$VERSION/RELEASED" "$RUNNER_TEMP/RELEASED" > /dev/null 2>&1; then
                # The domain already serves this version. HEAD may still stand
                # in for it if its export is byte for byte what was released -
                # a workflow-only fix merged in between - never otherwise.
                released=$(awk '$1 == "sha256" {print $2}' "$RUNNER_TEMP/RELEASED")
                local=$(cut -d' ' -f1 export/registry.json.sha256)
                if [ "$released" != "$local" ]; then
                  echo "::error::$VERSION is already released on the domain with export $released; HEAD's export is $local"
                  exit 1
                fi
              fi
              if gh release view "$VERSION" > /dev/null 2>&1; then
                # Published on GitHub too: the tag is history and stays where
                # it is. This run is a re-run of the pointer and website steps
                # (the export at HEAD was just proven identical when the domain
                # serves it; if it does not, the release was never finished).
                echo "::notice::$VERSION is already published from $(git rev-parse --short "$VERSION^{commit}"); re-running the pointer steps without moving the tag"
              else
                echo "::notice::tag $VERSION names an unfinished attempt at $(git rev-parse --short "$VERSION^{commit}"); moving it to HEAD"
                git tag -fa "$VERSION" -F "$RUNNER_TEMP/notes.md"
                git push --force origin "refs/tags/$VERSION"
              fi
            fi
          else
            git tag -a "$VERSION" -F "$RUNNER_TEMP/notes.md"
            git push origin "refs/tags/$VERSION"
          fi
          echo "TAG=$VERSION" >> "$GITHUB_ENV"

      - name: Use the pushed tag
        if: github.event_name == 'push'
        run: echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Tests and invariants on the tagged commit
        run: |
          python -m unittest discover -s tests
          python -m registry.validate

      - name: Build the manifest
        run: python -m registry.manifest --dataset-version "$TAG" --out manifest.json

      - name: Find the previous release
        run: |
          # The newest release tag reachable from the commit being tagged:
          # changes.json describes the way from it, and the image check
          # trusts the addresses it already verified. The export is read
          # from git by tag, so no download and no dependence on the bucket.
          PREVIOUS=$(git tag --list 'v*' --sort=-v:refname --merged "$TAG^" 2> /dev/null | head -n 1)
          if [ -n "$PREVIOUS" ] && git cat-file -e "$PREVIOUS:export/registry.json" 2> /dev/null; then
            git show "$PREVIOUS:export/registry.json" > "$RUNNER_TEMP/previous.json"
            echo "PREVIOUS=$PREVIOUS" >> "$GITHUB_ENV"
            echo "previous release: $PREVIOUS"
          else
            echo "::notice::no earlier release found; changes.json will say this release came from nothing"
          fi

      - name: Build the published objects
        run: |
          MAJOR="${TAG%%.*}"
          echo "MAJOR=$MAJOR" >> "$GITHUB_ENV"
          PREVIOUS_ARGS=""
          if [ -n "$PREVIOUS" ]; then
            PREVIOUS_ARGS="--previous $RUNNER_TEMP/previous.json --previous-tag $PREVIOUS"
          fi
          # The base URL variable is accepted with or without a scheme or a
          # trailing slash; everything downstream needs the canonical form.
          if [ -n "$REGISTRY_BASE_URL" ]; then
            case "$REGISTRY_BASE_URL" in http://*|https://*) ;; *) REGISTRY_BASE_URL="https://$REGISTRY_BASE_URL";; esac
            REGISTRY_BASE_URL="${REGISTRY_BASE_URL%/}"
            echo "REGISTRY_BASE_URL=$REGISTRY_BASE_URL" >> "$GITHUB_ENV"
            echo "base url: $REGISTRY_BASE_URL"
          fi
          if [ -n "$R2_BUCKET" ]; then
            python -m registry.publish --dataset-version "$TAG" --manifest manifest.json \
              --base-url "$REGISTRY_BASE_URL/$TAG" --latest-url "$REGISTRY_BASE_URL/$MAJOR" \
              --out dist $PREVIOUS_ARGS
          else
            python -m registry.publish --dataset-version "$TAG" --manifest manifest.json \
              --out dist $PREVIOUS_ARGS
          fi

      - name: What this release changes
        run: |
          # Prints the summary and fails the release if an identifier was
          # removed within a major: ids are permanent, and a release that
          # drops one is a breaking change that needs a new major.
          python -m registry.changes --check dist/changes.json

      - name: Hosting is not configured
        if: env.R2_BUCKET == ''
        run: |
          echo "::warning::vars.R2_BUCKET is not set: publishing to GitHub only. See CONTRIBUTING, 'Hosting' for the variables and secrets that switch the domain on."

      # ---- hosted steps: everything below runs only once hosting is configured

      - name: Immutability check
        if: env.R2_BUCKET != ''
        run: |
          if aws s3api head-object --bucket "$R2_BUCKET" --key "$TAG/RELEASED" > /dev/null 2>&1; then
            echo "::notice::$TAG is already released on the domain; skipping upload and verification, redoing the pointers"
            echo "ALREADY_RELEASED=true" >> "$GITHUB_ENV"
            exit 0
          fi
          if aws s3 cp "s3://$R2_BUCKET/$TAG/registry.json.sha256" "$RUNNER_TEMP/remote.sha256" > /dev/null 2>&1; then
            if ! cmp -s "$RUNNER_TEMP/remote.sha256" dist/registry.json.sha256; then
              echo "::error::$TAG already exists on the domain with a different registry.json; bytes at a published path never change. Release a new version instead."
              exit 1
            fi
            echo "::notice::resuming a partial upload of $TAG (same bytes)"
          fi

      - name: Upload the release root (immutable)
        if: env.R2_BUCKET != '' && env.ALREADY_RELEASED != 'true'
        run: |
          # Thousands of small objects: raise the client's parallelism. When
          # resuming a partial upload, compare by size only - a fresh checkout
          # gives every file a new mtime, and the immutability check above has
          # already proved the export behind these objects is the same bytes.
          aws configure set default.s3.max_concurrent_requests 64
          aws configure set default.s3.max_queue_size 10000
          # JSON objects get their content type from the extension; the
          # checksum file is text.
          aws s3 sync dist "s3://$R2_BUCKET/$TAG/" --no-progress --size-only \
            --exclude "registry.json.sha256" \
            --cache-control "public, max-age=31536000, immutable" | tail -n 3
          aws s3 cp dist/registry.json.sha256 "s3://$R2_BUCKET/$TAG/registry.json.sha256" \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "public, max-age=31536000, immutable"
          # CORS is a bucket setting, which an Object Read & Write token may
          # not change; the release does not depend on it, so a refusal is a
          # warning and the setting is made once in the dashboard instead.
          cat > "$RUNNER_TEMP/cors.json" <<'JSON'
          {"CORSRules": [{"AllowedOrigins": ["*"], "AllowedMethods": ["GET", "HEAD"],
                          "AllowedHeaders": ["*"], "ExposeHeaders": ["ETag"],
                          "MaxAgeSeconds": 86400}]}
          JSON
          if ! aws s3api put-bucket-cors --bucket "$R2_BUCKET" --cors-configuration "file://$RUNNER_TEMP/cors.json" 2> "$RUNNER_TEMP/cors.err"; then
            echo "::warning::could not set the bucket's CORS policy ($(tr -d '\n' < "$RUNNER_TEMP/cors.err")). Set it once in the dashboard: R2 > $R2_BUCKET > Settings > CORS policy, see CONTRIBUTING 'Hosting'."
          fi

      - name: Every referenced image is served
        if: env.R2_BUCKET != '' && env.ALREADY_RELEASED != 'true'
        run: |
          # Addresses a previous release already published were checked when
          # it published, and an image object is content-addressed: the art
          # key is in its name, so an address cannot come to mean other bytes.
          # Only the new ones are checked here - a release that touches no
          # images then costs no requests. What this no longer catches is an
          # object deleted from the bucket behind an address nothing changed;
          # the weekly image sync re-verifies every held object for that.
          if [ -n "$PREVIOUS" ]; then
            echo "checking against $PREVIOUS"
            python -m registry.hosted check-images --export dist/registry.json \
              --verified-in "$RUNNER_TEMP/previous.json"
          else
            echo "no earlier release to check against; checking every address"
            python -m registry.hosted check-images --export dist/registry.json
          fi

      - name: Verify what the CDN serves, then mark the root released
        if: env.R2_BUCKET != '' && env.ALREADY_RELEASED != 'true'
        run: |
          python -m registry.hosted verify-root --base-url "$REGISTRY_BASE_URL" --tag "$TAG" --dist dist
          {
            echo "sha256 $(cut -d' ' -f1 dist/registry.json.sha256)"
            echo "run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$RUNNER_TEMP/RELEASED"
          aws s3 cp "$RUNNER_TEMP/RELEASED" "s3://$R2_BUCKET/$TAG/RELEASED" \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "public, max-age=31536000, immutable"

      - name: List the release in versions.json
        if: env.R2_BUCKET != ''
        run: |
          aws s3 cp "s3://$R2_BUCKET/versions.json" "$RUNNER_TEMP/previous.json" > /dev/null 2>&1 \
            || : > "$RUNNER_TEMP/previous.json"
          python -m registry.versions --add "$TAG" --sha256 "$(cut -d' ' -f1 dist/registry.json.sha256)" \
            --base-url "$REGISTRY_BASE_URL" --previous "$RUNNER_TEMP/previous.json" --out versions.json
          cat versions.json
          aws s3 cp versions.json "s3://$R2_BUCKET/versions.json" \
            --content-type "application/json" --cache-control "public, max-age=60"

      - name: Point the major alias at the release
        if: env.R2_BUCKET != ''
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          python -m registry.hosted flip-alias --base-url "$REGISTRY_BASE_URL" --major "$MAJOR" \
            --tag "$TAG" --versions versions.json --zone "$CF_ZONE_ID" --rule-id "$CF_REDIRECT_RULE_ID"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "GitHub release $TAG already exists; nothing to publish (re-run)"
            exit 0
          fi
          gh release create "$TAG" manifest.json dist/changes.json \
            --title "$TAG" --notes-from-tag --verify-tag

      - name: Rebuild the website
        if: env.R2_BUCKET != ''
        env:
          PAGES_DEPLOY_HOOK: ${{ secrets.PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$PAGES_DEPLOY_HOOK" ]; then
            echo "no PAGES_DEPLOY_HOOK secret: the website is not wired up yet"
            exit 0
          fi
          curl -fsS -X POST "$PAGES_DEPLOY_HOOK" > /dev/null && echo "website rebuild requested"
