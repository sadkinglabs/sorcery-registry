name: validate

on:
  push:
    branches: [main]
  pull_request:
  # A pull request opened by another workflow's token (the images sync)
  # does not trigger this one - GitHub's rule against workflows that
  # trigger workflows - so that workflow dispatches it on its branch.
  workflow_dispatch:

# The check needs to read the repository and nothing else.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: The committed TypeScript declarations match the schema
        run: python -m registry.types --check

      - name: The publisher produces the release objects
        run: |
          python -m registry.publish --dataset-version vX.Y.Z --out "$RUNNER_TEMP/dist" \
            --base-url https://api.kairosarchive.net/vX.Y.Z --latest-url https://api.kairosarchive.net/v3

      - name: MCP server builds and registers its tools
        run: |
          python - <<'EOF'
          import asyncio
          from mcp_server import build_server
          tools = asyncio.run(build_server().list_tools())
          names = sorted(t.name for t in tools)
          expected = ["get_card", "get_printing", "registry_stats",
                      "resolve_slug", "search_cards", "search_printings",
                      "set_contents"]
          assert names == expected, names
          print("ok:", ", ".join(names))
          EOF

      - name: Invariants (including append-only vs base)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          elif git rev-parse --verify -q HEAD~1 > /dev/null; then
            BASE="HEAD~1"
          else
            BASE=""
          fi
          if [ -n "$BASE" ]; then
            python -m registry.validate --against "$BASE"
          else
            python -m registry.validate
          fi

      # The declarations are only worth shipping if the real data satisfies
      # them: a literal-typed slice of the export is assigned to the
      # generated types under strict tsc, and two deliberate misuses must
      # be rejected, so the types are neither too loose nor too tight.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: The export type-checks against types.d.ts
        run: |
          python -m registry.types --sample tests/ts/sample.ts
          npx --yes --package typescript@6 tsc -p tests/ts/tsconfig.json
          errors=$(npx --yes --package typescript@6 tsc -p tests/ts/tsconfig.bad.json 2>&1 | grep -c "error TS" || true)
          if [ "$errors" != "2" ]; then
            echo "::error::expected exactly 2 type errors from tests/ts/bad.ts, got $errors"
            npx --yes --package typescript@6 tsc -p tests/ts/tsconfig.bad.json || true
            exit 1
          fi
          echo "types.d.ts: sample satisfies the declarations; both misuses rejected"
