name: check-domain

# On demand: prove what api.kairosarchive.net serves right now, from a
# runner (the maintainers' own machines may not reach it). Runs the same
# verification the release performs - registry.json digest, index.json,
# a card and a slug object, the CORS header - against a release root, and
# shows the alias redirect and versions.json. Read-only: no credentials.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release root to verify, e.g. v3.1.0 (empty: the newest in versions.json)"
        required: false
        default: ""
  schedule:
    # Weekly, Wednesday 06:00 UTC, after Monday's drift check and Tuesday's
    # image sync: the newest release root is still served byte for byte,
    # the alias still points at it, CORS and the User-Agent rule still hold.
    - cron: "0 6 * * 3"

permissions:
  contents: read

env:
  REGISTRY_BASE_URL: ${{ vars.REGISTRY_BASE_URL }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve the base URL and the tag
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          base="${REGISTRY_BASE_URL:-https://api.kairosarchive.net}"
          case "$base" in http://*|https://*) ;; *) base="https://$base";; esac
          base="${base%/}"
          echo "BASE=$base" >> "$GITHUB_ENV"
          echo "== versions.json"
          curl -fsS -A "sorcery-registry-check (+https://kairosarchive.net)" "$base/versions.json" | tee "$RUNNER_TEMP/versions.json"
          tag="$TAG_INPUT"
          if [ -z "$tag" ]; then
            tag=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['latest']['v3'])" "$RUNNER_TEMP/versions.json")
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "checking $base/$tag/"

      - name: Fetch what the release built, to compare against
        run: |
          # The published objects are rebuilt from the tagged export so the
          # digest and index can be compared exactly as the release did.
          git fetch --depth 1 origin "refs/tags/$TAG:refs/tags/$TAG"
          git checkout -q "$TAG"
          MAJOR="${TAG%%.*}"
          python -m registry.publish --dataset-version "$TAG" --base-url "$BASE/$TAG" --latest-url "$BASE/$MAJOR" --out dist

      - name: Verify the release root (digest, index, objects, CORS)
        run: python -m registry.hosted verify-root --base-url "$BASE" --tag "$TAG" --dist dist

      - name: Show the edge behaviour
        run: |
          ua="sorcery-registry-check (+https://kairosarchive.net)"
          echo "== alias: $BASE/v3/index.json"
          curl -sS -o /dev/null -A "$ua" -w "%{http_code} -> %{redirect_url}\n" "$BASE/v3/index.json"
          echo "== headers on the release root"
          curl -sSI -A "$ua" "$BASE/$TAG/registry.json.sha256" | grep -i -E '^(HTTP|cache-control|cf-cache-status|content-type|access-control|etag)' || true
          echo "== CORS preflight from another origin"
          curl -sSI -A "$ua" -H "Origin: https://example.com" -H "Access-Control-Request-Method: GET" -X OPTIONS "$BASE/$TAG/index.json" | grep -i -E '^(HTTP|access-control)' || true
          echo "== anonymous client (no User-Agent): expect 403 from the WAF rule"
          curl -sS -o /dev/null -A "" -H "User-Agent:" -w "%{http_code}\n" "$BASE/$TAG/index.json"
          # The cache key must ignore the query string: a review found that
          # ?anything= on a warm object was a fresh origin read, so a client
          # could turn every cached read into a billable one. Warm the bare
          # URL, then ask twice with different junk queries. Both must be HIT
          # and still carry the CORS header. All three requests leave one
          # runner, so they should reach the same edge; a MISS on the third
          # line is the rule not applying, not a different colo.
          echo "== cache key ignores the query string: warm, then two junk queries (expect HIT, HIT)"
          for q in "" "?kairos_check=one" "?kairos_check=two"; do
            printf '%-22s ' "${q:-(bare)}"
            curl -sSI -A "$ua" "$BASE/$TAG/cards/C000001.json$q" | grep -i -E '^(HTTP|cf-cache-status|access-control-allow-origin)' | tr -d '\r' | tr '\n' ' '
            echo
          done
          # Those three warmed the object without an Origin header, and R2
          # only adds CORS headers to requests that send one. If the edge now
          # serves that cached response to a browser, the browser sees no
          # access-control-allow-origin and a cross-origin fetch fails - the
          # one way an "ignore query string" rule can break a public API.
          # So ask as a browser would, on the object just warmed.
          echo "== a browser's request on the warmed object (expect access-control-allow-origin: *)"
          curl -sSI -A "$ua" -H "Origin: https://example.com" "$BASE/$TAG/cards/C000001.json?kairos_check=three" | grep -i -E '^(HTTP|cf-cache-status|access-control-allow-origin)' | tr -d '\r' | tr '\n' ' '
          echo

      - name: Inspect served images (alpha channel, corners) on one face of each resolution family
        run: |
          if [ ! -f data/images.json ]; then echo "no images held at $TAG"; exit 0; fi
          pip install -q pillow
          python - <<'PY'
          import io, json, urllib.request
          from PIL import Image
          from registry.export import face_urls
          state = json.load(open("data/images.json"))
          picked = {}
          for pid, faces in state["printings"].items():
              held = faces.get("front")
              if held and held["lowres"] not in picked:
                  picked[held["lowres"]] = (pid, held)
          for lowres, (pid, held) in sorted(picked.items()):
              for rendition in ("original", "small"):
                  url = face_urls(pid, held)[rendition]
                  req = urllib.request.Request(url, headers={"User-Agent": "sorcery-registry-check (+https://kairosarchive.net)"})
                  with urllib.request.urlopen(req, timeout=60) as r:
                      data = r.read(); ctype = r.headers.get("Content-Type")
                  with Image.open(io.BytesIO(data)) as im:
                      w, h = im.size
                      rgba = im.convert("RGBA")
                      corners = [rgba.getpixel(p)[3] for p in ((0, 0), (w - 1, 0), (0, h - 1), (w - 1, h - 1))]
                      centre = rgba.getpixel((w // 2, h // 2))[3]
                      print(f"{'lowres' if lowres else 'ok    '} {pid} {rendition:8} {im.format} {im.mode} {w}x{h} {len(data)//1024}K {ctype}"
                            f" | alpha channel: {'yes' if 'A' in im.getbands() else 'no'} | corner alpha: {corners} | centre alpha: {centre}")
          PY
