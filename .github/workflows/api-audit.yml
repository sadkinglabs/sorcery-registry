name: api-audit

# Tests every assertion docs/api.md and docs/quickstart.md make against the
# live domain, from a runner (a sandbox cannot reach the zone). Read-only:
# it fetches published objects and reports, and changes nothing.

on:
  push:
    branches: ["audit/**"]
  schedule:
    # Thursday 06:00 UTC, away from the other weekly jobs: a release that
    # changes what the prose promises should fail here, not in a consumer.
    - cron: "0 6 * * 4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --quiet -r requirements-ci.txt
      - name: Test the documented contract
        run: |
          set -o pipefail
          python scripts/audit_api.py | tee audit.log
      - name: Headers, compression, error shapes and data claims
        if: always()
        run: |
          set -o pipefail
          python scripts/audit_api2.py | tee audit2.log
      - name: Report
        if: always()
        run: |
          {
            echo '### API documentation audit'
            echo '```'
            tail -40 audit.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: audit-report
          path: |
            audit-report.json
            audit.log
            audit2.log
